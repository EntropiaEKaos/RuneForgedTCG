name: Vanilla 1.11 Global Floor Diagnostic

on:
  push:
    branches:
      - engineering/vanilla-1-11-tide-control-floor
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-global-floor:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.2
          package-manager-cache: false

      - name: Install dependencies
        run: npm run ci:install

      - name: Typecheck diagnostic
        run: npm run typecheck

      - name: Run current-product 13,200-game Vanilla matrix
        run: |
          mkdir -p artifacts/vanilla-1-11
          node --import tsx scripts/vanilla-balance-audit.ts 40 5 --enforce \
            --write artifacts/vanilla-1-11/VANILLA_1.11_GLOBAL_DIAGNOSTIC.json

      - name: Upload global diagnostic evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vanilla-1-11-global-diagnostic-${{ github.sha }}
          path: artifacts/vanilla-1-11/VANILLA_1.11_GLOBAL_DIAGNOSTIC.json
          if-no-files-found: error
          retention-days: 14
