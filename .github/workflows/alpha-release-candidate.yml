name: Alpha Release Candidate

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "drizzle/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/alpha-release-candidate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alpha-release-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_DB: runeforge_alpha_rc
          POSTGRES_USER: runeforge
          POSTGRES_PASSWORD: runeforge_alpha_rc_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U runeforge -d runeforge_alpha_rc"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      DATABASE_URL: postgresql://runeforge:runeforge_alpha_rc_only@localhost:5432/runeforge_alpha_rc
      PLAYER_SESSION_SECRET: alpha-rc-player-session-secret-00000001
      ADMIN_SESSION_SECRET: alpha-rc-admin-session-secret-00000002
      MFA_ENCRYPTION_KEY: alpha-rc-mfa-encryption-key-000000000003
      PAYMENT_ENCRYPTION_KEY: alpha-rc-payment-encryption-key-00000004
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: alpha-rc-admin-password-not-for-production
      NEXT_PUBLIC_APP_URL: https://alpha-rc.runeforge.invalid
      TRUST_PROXY: "false"
      ALLOW_LEGACY_PLAYER_IDENTITY: "false"
      RANKED_RELEASE_CERTIFIED: "false"
      RUNEFORGE_RELEASE: "2.97.0"
      RUNEFORGE_DEPLOY_SHA: ${{ github.sha }}
      RUNEFORGE_DEPLOY_ENV: alpha
      ASSET_STORAGE_MODE: local
      ALLOW_LOCAL_ASSET_STORAGE: "true"
      E2E_BASE_URL: http://127.0.0.1:3000

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup certified Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          package-manager-cache: false

      - name: Clean registry install
        run: npm ci --no-audit --no-fund

      - name: Runtime and lock reproducibility
        run: npm run release:runtime-gate

      - name: Fresh PostgreSQL bootstrap
        run: npm run db:bootstrap

      - name: Production verification with Alpha boundaries
        run: npm run production:verify

      - name: Launch exact production build and certify public Alpha scope
        run: |
          mkdir -p artifacts/alpha-release-candidate
          npm start > artifacts/alpha-release-candidate/next-server.log 2>&1 &
          NEXT_PID=$!
          trap 'status=$?; if [ "$status" -ne 0 ]; then echo "--- Next server log ---"; cat artifacts/alpha-release-candidate/next-server.log; fi; kill $NEXT_PID 2>/dev/null || true; exit "$status"' EXIT

          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null; then break; fi
            if [ "$i" = "60" ]; then cat artifacts/alpha-release-candidate/next-server.log; exit 1; fi
            sleep 1
          done

          npm run test:e2e:alpha-journey
          node scripts/alpha-casual-pvp-journey.mjs
          node scripts/alpha-visual-journey.mjs
          npm run alpha:release-evidence

      - name: Upload release-candidate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: alpha-release-candidate-${{ github.sha }}
          path: |
            artifacts/alpha-release-candidate
            artifacts/alpha-visual
          if-no-files-found: error
          retention-days: 30
