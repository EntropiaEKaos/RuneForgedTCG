name: Temporary Rollback Certification Fix 2.97.7

on:
  push:
    branches: ['engineering/content-rollback-2.97.7']
    paths: ['.github/workflows/temp-fix-rollback-cert-2977.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Fix canonical custom-card assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/studio-version-rollback-certification-2.97.7.ts')
          text = path.read_text()
          old = '''    assert.equal(cardRollback.row.description, "Card rollback version one", "card definition must restore from v1");
              assert.equal(cardRollback.row.art, "/certification/rollback-2977-v1.webp", "card art must restore from v1");'''
          if old not in text:
              old = '''    assert.equal(cardRollback.row.description, "Card rollback version one", "card definition must restore from v1");
    assert.equal(cardRollback.row.art, "/certification/rollback-2977-v1.webp", "card art must restore from v1");'''
          if old not in text:
              raise SystemExit('rollback assertion block not found')
          new = '''    assert.equal(cardRollback.row.data?.description, "Card rollback version one", "card definition must restore from v1");
    assert.equal(cardRollback.row.data?.art, "/certification/rollback-2977-v1.webp", "card art must restore from v1");'''
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git diff -- scripts/studio-version-rollback-certification-2.97.7.ts
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/studio-version-rollback-certification-2.97.7.ts
          git commit -m 'test(studio): assert canonical rolled-back card payload'
          git push origin HEAD:engineering/content-rollback-2.97.7
