name: Ranked Release Certification

on:
  workflow_dispatch:
  pull_request:
    branches: [main, master]
    paths:
      - '.github/workflows/ranked-release-certification.yml'
      - 'scripts/ranked-**'
      - 'scripts/balance-audit-2.97.ts'
      - 'src/game/ranked-decks.ts'
      - 'src/lib/ranked**'
      - 'src/lib/pvp-**'
      - 'src/app/api/matchmaking/**'
      - 'src/app/api/pvp/**'
      - 'src/app/api/ranked/**'
      - 'src/db/schema/**'
      - 'drizzle/**'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/ranked-release-certification.yml'
      - 'scripts/ranked-**'
      - 'scripts/balance-audit-2.97.ts'
      - 'src/game/ranked-decks.ts'
      - 'src/lib/ranked**'
      - 'src/lib/pvp-**'
      - 'src/app/api/matchmaking/**'
      - 'src/app/api/pvp/**'
      - 'src/app/api/ranked/**'
      - 'src/db/schema/**'
      - 'drizzle/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: ranked-cert-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify-ranked:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_DB: runeforge_ranked_ci
          POSTGRES_USER: runeforge
          POSTGRES_PASSWORD: runeforge_ranked_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U runeforge -d runeforge_ranked_ci"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      DATABASE_URL: postgresql://runeforge:runeforge_ranked_ci_only@localhost:5432/runeforge_ranked_ci
      NODE_ENV: test
      PLAYER_SESSION_SECRET: ranked-ci-player-session-secret-github-actions-0001
      ADMIN_SESSION_SECRET: ranked-ci-admin-session-secret-github-actions-0002
      MFA_ENCRYPTION_KEY: ranked-ci-mfa-encryption-key-github-actions-000003
      PAYMENT_ENCRYPTION_KEY: ranked-ci-payment-encryption-key-github-actions-0004
      ADMIN_PASSWORD: ranked-ci-only-admin-password-not-for-prod-use
      NEXT_PUBLIC_APP_URL: https://ranked-cert.runeforge.invalid
      TRUST_PROXY: "false"
      ALLOW_LEGACY_PLAYER_IDENTITY: "false"
      RANKED_RELEASE_CERTIFIED: "true"
      GAME_CONFIG_CACHE_TTL_MS: "250"
      RUNEFORGE_RELEASE: "2.97.0"
      RUNEFORGE_DEPLOY_SHA: ${{ github.sha }}
      RUNEFORGE_DEPLOY_ENV: ci
      ASSET_STORAGE_MODE: local
      ALLOW_LOCAL_ASSET_STORAGE: "true"

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup certified Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          package-manager-cache: false

      - name: Clean registry install
        run: npm run ci:install

      - name: Fresh PostgreSQL bootstrap and upgrades
        run: |
          npm run db:bootstrap
          npm run db:upgrade

      - name: Certified Ranked production verification
        run: npm run production:verify

      - name: Two-player Ranked browser certification
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
        run: |
          npm start > /tmp/runeforge-ranked-next.log 2>&1 &
          NEXT_PID=$!
          trap 'status=$?; if [ "$status" -ne 0 ]; then echo "--- Ranked Next server log ---"; cat /tmp/runeforge-ranked-next.log; fi; kill $NEXT_PID 2>/dev/null || true; exit "$status"' EXIT
          for i in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null; then break; fi
            if [ "$i" = "45" ]; then cat /tmp/runeforge-ranked-next.log; exit 1; fi
            sleep 1
          done
          node --import tsx scripts/ranked-browser-certification.ts

      - name: Upload Ranked certification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ranked-release-certification-${{ github.sha }}
          path: |
            artifacts/ranked-certification
            BALANCE_AUDIT_2.97.json
          if-no-files-found: error
          retention-days: 30
