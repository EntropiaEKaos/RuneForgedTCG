name: Temporary Studio CAS Fix 2.97.6

on:
  push:
    branches: ['engineering/studio-functional-certification-2.97.6']
    paths: ['.github/workflows/temp-fix-studio-cas-2976.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Patch locked content CAS and close certification pool
        run: |
          python3 - <<'PY'
          from pathlib import Path

          route = Path('src/app/api/admin/studio/pipeline/route.ts')
          text = route.read_text()
          old = '''      const updatedAtColumn = (table as any).updatedAt;
                const publishWhere = updatedAtColumn && row.updatedAt
                  ? and(eq((table as any).id, id), eq(updatedAtColumn, row.updatedAt))
                  : eq((table as any).id, id);
          '''
          # tolerate source indentation exactly as checked out
          if old not in text:
              old = '''      const updatedAtColumn = (table as any).updatedAt;
              const publishWhere = updatedAtColumn && row.updatedAt
                ? and(eq((table as any).id, id), eq(updatedAtColumn, row.updatedAt))
                : eq((table as any).id, id);
          '''
          if old not in text:
              raise SystemExit('publishWhere block not found')
          new = '''      // The row is locked FOR UPDATE below and its approved content hash is
              // recomputed inside the same transaction before mutation. Do not compare a
              // PostgreSQL timestamp to a round-tripped JavaScript Date here: PostgreSQL
              // retains sub-millisecond precision that JS Date discards, which can reject
              // unchanged approved rows. The lock + exact hash is the authoritative CAS.
              const publishWhere = eq((table as any).id, id);
          '''
          text = text.replace(old, new, 1)
          route.write_text(text)

          cert = Path('scripts/studio-functional-certification-2.97.6.ts')
          text = cert.read_text()
          text = text.replace('import { db } from "@/db";', 'import { db, pool } from "@/db";', 1)
          old_tail = '''main().catch((error) => {
            console.error("STUDIO FUNCTIONAL CERTIFICATION 2.97.6: FAIL", error);
            process.exitCode = 1;
          });
          '''
          if old_tail not in text:
              raise SystemExit('certification tail not found')
          new_tail = '''main()
            .then(async () => { await pool.end(); })
            .catch(async (error) => {
              console.error("STUDIO FUNCTIONAL CERTIFICATION 2.97.6: FAIL", error);
              await pool.end().catch(() => undefined);
              process.exitCode = 1;
            });
          '''
          cert.write_text(text.replace(old_tail, new_tail, 1))
          PY
          git diff --check
          git diff -- src/app/api/admin/studio/pipeline/route.ts scripts/studio-functional-certification-2.97.6.ts
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/api/admin/studio/pipeline/route.ts scripts/studio-functional-certification-2.97.6.ts
          git commit -m 'fix(studio): use locked approval hash for publish CAS'
          git push origin HEAD:engineering/studio-functional-certification-2.97.6
