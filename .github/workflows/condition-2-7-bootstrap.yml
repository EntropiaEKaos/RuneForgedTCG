name: Condition 2.7 Bootstrap

on:
  push:
    branches:
      - "feat/condition-2-7-resource-thresholds"

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - name: Implement Condition 2.7
        run: python3 scripts/condition-2-7-bootstrap.py
      - name: Install dependencies
        run: npm run ci:install
      - name: Validate implementation
        run: |
          npm run typecheck
          npm run lint -- --max-warnings 0
          npm run test:behavior
      - name: Commit implementation
        run: |
          rm .github/workflows/condition-2-7-bootstrap.yml scripts/condition-2-7-bootstrap.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Condition System 2.7: Resource Thresholds"
          git push origin HEAD:feat/condition-2-7-resource-thresholds
