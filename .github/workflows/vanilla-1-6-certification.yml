name: Vanilla 1.6 Product Certification

on:
  push:
    branches: ['feat/vanilla-1-6-tempestade-vanguard-ceiling']

permissions:
  contents: read

concurrency:
  group: vanilla-1-6-product-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          package-manager-cache: false

      - name: Install dependencies
        run: npm run ci:install

      - name: TypeScript
        run: npm run typecheck

      - name: Behavioral suite
        run: npm run test:behavior

      - name: Product Vanilla Balance Lab
        run: npm run audit:vanilla-balance

      - name: Upload product balance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vanilla-1-6-product-certification-${{ github.sha }}
          path: VANILLA_BALANCE_AUDIT_1.1.json
          if-no-files-found: error
          retention-days: 7
