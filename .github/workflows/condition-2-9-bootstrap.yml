name: Condition 2.9 Bootstrap

on:
  push:
    branches:
      - feat/condition-2-9-match-progress-thresholds

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Implement Condition 2.9
        run: python3 scripts/condition-2-9-bootstrap-runner.py

      - name: Install dependencies
        run: npm run ci:install

      - name: Validate implementation
        run: |
          npm run typecheck
          npm run lint -- --max-warnings 0
          npm run test:behavior

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No implementation changes to commit"
            exit 1
          fi
          git commit -m "Condition System 2.9: Match Progress Thresholds"
          git push
