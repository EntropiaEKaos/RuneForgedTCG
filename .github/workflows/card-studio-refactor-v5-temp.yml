name: Temporary Card Studio Refactor V5

on:
  push:
    branches:
      - engineering/card-studio-modularity-2.97.5

permissions:
  contents: write

concurrency:
  group: card-studio-refactor-v5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          package-manager-cache: false

      - name: Run corrected deterministic transform
        run: |
          python <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/card-studio-refactor-temp.yml').read_text()
          workflow = workflow.replace(
              'auth, rows, card, id, tab, setTab, tests, testBusy, setTestBusy, testName, setTestName,',
              'auth, rows, card, cm, id, tab, setTab, tests, testBusy, setTestBusy, testName, setTestName,',
              1,
          )
          marker = "          python <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index('\n          PY', start)
          exec(compile(textwrap.dedent(workflow[start:end]), 'card-studio-refactor-transform.py', 'exec'))

          contract_path = Path('src/lib/card-studio-4.1-2.75.test.ts')
          contract = contract_path.read_text()
          old_contract = 'const studio = source("src/app/admin/studio/cards/CardAuthoringStudio.tsx") + source("src/app/admin/studio/cards/CardAuthoringFields.tsx") + source("src/app/admin/studio/cards/useCardAuthoringModel.ts");'
          new_contract = '''const studio = [
            "CardAuthoringStudio.tsx",
            "CardAuthoringFields.tsx",
            "useCardAuthoringModel.ts",
            "CardIdentityTab.tsx",
            "CardClassificationTab.tsx",
            "CardRulesTab.tsx",
            "CardReleaseTab.tsx",
          ].map((file) => source(`src/app/admin/studio/cards/${file}`)).join("\\n");'''
          if old_contract not in contract:
              raise RuntimeError('Card Studio source contract insertion point missing')
          contract_path.write_text(contract.replace(old_contract, new_contract, 1))

          evolution_path = Path('src/lib/evolution-2.87.test.ts')
          evolution = evolution_path.read_text()
          old_evolution = 'const studio = readFileSync("src/app/admin/studio/cards/CardAuthoringStudio.tsx", "utf8");'
          new_evolution = '''const studio = [
            "CardAuthoringStudio.tsx",
            "CardIdentityTab.tsx",
            "CardClassificationTab.tsx",
            "CardRulesTab.tsx",
            "CardReleaseTab.tsx",
          ].map((file) => readFileSync(`src/app/admin/studio/cards/${file}`, "utf8")).join("\\n");'''
          if old_evolution not in evolution:
              raise RuntimeError('Evolution Studio contract insertion point missing')
          evolution_path.write_text(evolution.replace(old_evolution, new_evolution, 1))

          growth_path = Path('src/lib/growth-commerce-2.93.test.ts')
          growth = growth_path.read_text()
          old_growth = 'const studio = read("src/app/admin/studio/cards/CardAuthoringStudio.tsx");'
          new_growth = '''const studio = [
            "CardAuthoringStudio.tsx",
            "CardIdentityTab.tsx",
            "CardClassificationTab.tsx",
            "CardRulesTab.tsx",
            "CardReleaseTab.tsx",
          ].map((file) => read(`src/app/admin/studio/cards/${file}`)).join("\\n");'''
          if old_growth not in growth:
              raise RuntimeError('Growth Studio contract insertion point missing')
          growth_path.write_text(growth.replace(old_growth, new_growth, 1))
          PY

      - name: Show remaining single-file Card Studio contracts
        run: grep -R -n 'CardAuthoringStudio.tsx' src/lib scripts | head -100 || true

      - name: Verify transformed source
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run audit:studio-structure
          npm run typecheck
          npm run lint -- --max-warnings 0
          npm run test:card-authoring
          npm run test:card-studio-4.1
          npm run test:studio-runtime
          npm run audit:source-contracts
          git diff --check

      - name: Remove temporary workflows and commit
        run: |
          git rm .github/workflows/card-studio-refactor-temp.yml .github/workflows/card-studio-refactor-v2-temp.yml .github/workflows/card-studio-refactor-v3-temp.yml .github/workflows/card-studio-refactor-v4-temp.yml .github/workflows/card-studio-refactor-v5-temp.yml
          expected='^.github/workflows/card-studio-refactor-temp.yml$|^.github/workflows/card-studio-refactor-v2-temp.yml$|^.github/workflows/card-studio-refactor-v3-temp.yml$|^.github/workflows/card-studio-refactor-v4-temp.yml$|^.github/workflows/card-studio-refactor-v5-temp.yml$|^.github/workflows/ci.yml$|^package.json$|^scripts/studio-structure-gate.mjs$|^src/lib/card-studio-4.1-2.75.test.ts$|^src/lib/evolution-2.87.test.ts$|^src/lib/growth-commerce-2.93.test.ts$|^src/app/admin/studio/cards/CardAuthoringModel.ts$|^src/app/admin/studio/cards/CardAuthoringStudio.tsx$|^src/app/admin/studio/cards/CardClassificationTab.tsx$|^src/app/admin/studio/cards/CardIdentityTab.tsx$|^src/app/admin/studio/cards/CardReleaseTab.tsx$|^src/app/admin/studio/cards/CardRulesTab.tsx$'
          unexpected=$(git status --porcelain | sed 's/^...//' | grep -Ev "$expected" || true)
          test -z "$unexpected" || { echo "Unexpected changed files:"; echo "$unexpected"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml package.json scripts/studio-structure-gate.mjs src/lib/card-studio-4.1-2.75.test.ts src/lib/evolution-2.87.test.ts src/lib/growth-commerce-2.93.test.ts src/app/admin/studio/cards
          git commit -m "refactor(studio): split card authoring tabs into bounded modules"
          git push origin HEAD:engineering/card-studio-modularity-2.97.5
