name: Bootstrap FX Dependencies

on:
  push:
    branches:
      - feat/forged-fx-system-1
    paths:
      - .github/workflows/bootstrap-fx-deps.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/forged-fx-system-1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Motion and GSAP with npm
        run: npm install --save-exact motion@13.3.0 gsap@3.15.0 --ignore-scripts --no-audit --no-fund
      - name: Remove one-shot bootstrap workflow
        run: git rm .github/workflows/bootstrap-fx-deps.yml
      - name: Commit generated dependency lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(fx): install Motion and GSAP"
          git push origin HEAD:feat/forged-fx-system-1
