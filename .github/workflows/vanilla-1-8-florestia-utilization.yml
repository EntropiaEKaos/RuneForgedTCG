name: Vanilla 1.8 Florestia Utilization Lab

on:
  push:
    branches: ['lab/vanilla-1-8-florestia-utilization']

permissions:
  contents: read

concurrency:
  group: vanilla-1-8-florestia-utilization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  utilization:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          package-manager-cache: false

      - name: Install dependencies
        run: npm run ci:install

      - name: Runtime integrity
        run: |
          npm run release:runtime-gate
          npm run typecheck

      - name: High-sample Vanilla utilization telemetry
        run: |
          mkdir -p artifacts
          node --import tsx scripts/vanilla-utilization-audit.ts 100 5 --write artifacts/VANILLA_1_8_FLORESTIA_UTILIZATION.json --enforce

      - name: Upload utilization evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6.0.0
        with:
          name: vanilla-1-8-florestia-utilization-${{ github.sha }}
          path: artifacts/VANILLA_1_8_FLORESTIA_UTILIZATION.json
          if-no-files-found: error
          retention-days: 14
