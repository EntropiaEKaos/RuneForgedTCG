name: Vanilla Balance Lab Bootstrap

on:
  push:
    branches:
      - feat/vanilla-1-1-balance-lab-matrix

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - name: Run Vanilla 1.1 full matrix
        run: node --import tsx scripts/vanilla-balance-audit.ts 40 5 --write VANILLA_BALANCE_AUDIT_1.1.json --enforce
      - uses: actions/upload-artifact@v4
        with:
          name: vanilla-balance-audit-1-1
          path: VANILLA_BALANCE_AUDIT_1.1.json
          if-no-files-found: error
