name: Vanilla Tactical Bootstrap

on:
  push:
    branches:
      - feat/vanilla-1-3-tactical-playability-friction

permissions:
  contents: read

jobs:
  tactical:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - name: Run Vanilla 1.3 tactical behavioral test
        run: npx tsx src/game/vanilla-tactical-playability-1-3.test.ts
      - name: Run Vanilla 1.2 utilization matrix after tactical fix
        run: node --import tsx scripts/vanilla-utilization-audit.ts 20 3 --write VANILLA_UTILIZATION_AUDIT_1.3.json --enforce
      - name: Run full Vanilla Balance Lab after tactical fix
        run: node --import tsx scripts/vanilla-balance-audit.ts 40 5 --write VANILLA_BALANCE_AUDIT_1.3.json --enforce
      - uses: actions/upload-artifact@v4
        with:
          name: vanilla-tactical-audits-1-3
          path: |
            VANILLA_UTILIZATION_AUDIT_1.3.json
            VANILLA_BALANCE_AUDIT_1.3.json
          if-no-files-found: error
