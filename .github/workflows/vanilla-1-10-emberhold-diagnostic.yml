name: Vanilla 1.10 Emberhold Diagnostic

on:
  push:
    branches:
      - engineering/vanilla-1-10-emberhold-ascendant-floor

permissions:
  contents: read

jobs:
  diagnose-emberhold-ascendant:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.2
          package-manager-cache: false

      - name: Install dependencies
        run: npm run ci:install

      - name: Typecheck diagnostic
        run: npm run typecheck

      - name: Run 2,200-game Emberhold Ascendant diagnostic
        run: |
          mkdir -p artifacts/vanilla-1-10
          node --import tsx scripts/vanilla-1-10-emberhold-diagnostic.ts \
            --write artifacts/vanilla-1-10/VANILLA_1.10_EMBERHOLD_DIAGNOSTIC.json

      - name: Screen Emberhold recipes against critical Vanguards
        run: |
          node --import tsx scripts/vanilla-1-10-emberhold-candidate-screen.ts \
            --write artifacts/vanilla-1-10/VANILLA_1.10_EMBERHOLD_CANDIDATE_SCREEN.json

      - name: Validate screen winner across full matrix
        run: |
          node --import tsx scripts/vanilla-1-10-emberhold-winner-validation.ts \
            --write artifacts/vanilla-1-10/VANILLA_1.10_EMBERHOLD_WINNER_VALIDATION.json

      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vanilla-1-10-emberhold-diagnostic-${{ github.sha }}
          path: |
            artifacts/vanilla-1-10/VANILLA_1.10_EMBERHOLD_DIAGNOSTIC.json
            artifacts/vanilla-1-10/VANILLA_1.10_EMBERHOLD_CANDIDATE_SCREEN.json
            artifacts/vanilla-1-10/VANILLA_1.10_EMBERHOLD_WINNER_VALIDATION.json
          if-no-files-found: error
          retention-days: 14
