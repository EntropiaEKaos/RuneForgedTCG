name: Temporary Card Studio Refactor

on:
  push:
    branches:
      - engineering/card-studio-modularity-2.97.5

permissions:
  contents: write

concurrency:
  group: card-studio-refactor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          package-manager-cache: false

      - name: Split Card Studio tabs
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import textwrap

          source_path = Path('src/app/admin/studio/cards/CardAuthoringStudio.tsx')
          source = source_path.read_text()

          def extract(tab, next_tab):
              marker = f'          {{tab === "{tab}" && (\n'
              next_marker = f'          {{tab === "{next_tab}" && ('
              start = source.index(marker)
              end = source.index(next_marker, start)
              block = source[start:end]
              body = block[len(marker):]
              suffix = '          )}\n'
              if not body.endswith(suffix):
                  raise RuntimeError(f'unexpected {tab} tab boundary')
              return block, textwrap.dedent(body[:-len(suffix)]).rstrip()

          identity_block, identity_body = extract('identity', 'classification')
          classification_block, classification_body = extract('classification', 'rules')
          rules_block, rules_body = extract('rules', 'tests')
          release_block, release_body = extract('collection', 'preview')

          shared_type = '''import type { useCardAuthoringModel } from "./useCardAuthoringModel";\n\nexport type CardAuthoringModel = ReturnType<typeof useCardAuthoringModel>;\n'''
          Path('src/app/admin/studio/cards/CardAuthoringModel.ts').write_text(shared_type)

          def component(name, imports, destructure, body):
              return (
                  '"use client";\n' + imports.rstrip() + '\n\n'
                  'import type { CardAuthoringModel } from "./CardAuthoringModel";\n\n'
                  f'export default function {name}({{ model }}: {{ model: CardAuthoringModel }}) {{\n'
                  f'  const {{ {destructure} }} = model;\n'
                  '  return (\n' + textwrap.indent(body, '    ') + '\n  );\n}\n'
              )

          Path('src/app/admin/studio/cards/CardIdentityTab.tsx').write_text(component(
              'CardIdentityTab',
              '''import { F, Panel } from "./CardAuthoringFields";
          import {
            CARD_REGIONS as REGIONS,
            CARD_TYPES as TYPES,
            CARD_RARITIES as RARITIES,
            CARD_REGIONAL_PERKS as REGIONAL_PERKS,
          } from "@/game/card-authoring";
          import { REGION_IDENTITY_STYLE } from "@/game/region-identity";''',
              'card, id, set, setPrimaryRegion, authoredRegions, toggleAuthoredRegion, regionIdentity',
              identity_body,
          ))

          Path('src/app/admin/studio/cards/CardClassificationTab.tsx').write_text(component(
              'CardClassificationTab',
              '''import type { CardDef } from "@/game/types";
          import { strategicRoleForCard, STRATEGIC_ROLE_IDENTITIES } from "@/game/card-role";
          import { EMPTY } from "./useCardAuthoringModel";
          import { F, Panel, ToggleField } from "./CardAuthoringFields";
          import {
            CARD_RACES as RACES,
            CARD_KEYWORDS as KWS,
            CARD_STRATEGIC_ROLES as STRATEGIC_ROLES,
            CARD_DOCTRINES as DOCTRINES,
          } from "@/game/card-authoring";''',
              'card, mechanicsCatalog, applyArchetypeItem, set, toggle, classes, toggleCustomKeyword',
              classification_body,
          ))

          Path('src/app/admin/studio/cards/CardRulesTab.tsx').write_text(component(
              'CardRulesTab',
              '''import RuleBuilder from "../RuleBuilder";
          import { EffectEditor, F, Json, Panel } from "./CardAuthoringFields";
          import {
            CARD_KEYWORDS as KWS,
            CARD_EFFECT_KINDS as EFFECT_KINDS,
            CARD_TRIGGERS as TRIGGERS,
            CARD_LEVEL_UP_TYPES as LEVEL_UP_TYPES,
          } from "@/game/card-authoring";''',
              'card, set, classes, mechanicsCatalog',
              rules_body,
          ))

          Path('src/app/admin/studio/cards/CardReleaseTab.tsx').write_text(component(
              'CardReleaseTab',
              '''import CollectionSymbolMark from "@/components/CollectionSymbolMark";
          import { Check, F, Panel } from "./CardAuthoringFields";''',
              'card, cm, setCm, cols, collectionIdentity, status, tests',
              release_body,
          ))

          function_marker = 'export default function CardAuthoringStudio() {'
          function_index = source.index(function_marker)
          preamble = '''"use client";
          import Link from "next/link";
          import { StudioCommandPalette, StudioBreadcrumb } from "../StudioChrome";
          import { useCardAuthoringModel } from "./useCardAuthoringModel";
          import { CardCatalogSidebar, CardStudioHeader, CardTests, CardWorkspaceHeader, Panel, Preview } from "./CardAuthoringFields";
          import CardIdentityTab from "./CardIdentityTab";
          import CardClassificationTab from "./CardClassificationTab";
          import CardRulesTab from "./CardRulesTab";
          import CardReleaseTab from "./CardReleaseTab";

          '''
          updated = textwrap.dedent(preamble) + source[function_index:]

          destructure_start = updated.index('  const {\n', updated.index(function_marker))
          destructure_end_marker = '  } = useCardAuthoringModel();\n'
          destructure_end = updated.index(destructure_end_marker, destructure_start) + len(destructure_end_marker)
          new_destructure = '''  const model = useCardAuthoringModel();
            const {
              auth, rows, card, id, tab, setTab, tests, testBusy, setTestBusy, testName, setTestName,
              testResult, setTestResult, msg, busy, val, edit, loadTests, reset, save, sandbox, impact, balance,
              validate, pipe, status, powerBudget, collectionIdentity, collectionForDefId, progress,
            } = model;
          '''
          updated = updated[:destructure_start] + textwrap.dedent(new_destructure) + updated[destructure_end:]

          replacements = [
              (identity_block, '          {tab === "identity" && <CardIdentityTab model={model} />}\n'),
              (classification_block, '          {tab === "classification" && <CardClassificationTab model={model} />}\n'),
              (rules_block, '          {tab === "rules" && <CardRulesTab model={model} />}\n'),
              (release_block, '          {tab === "collection" && <CardReleaseTab model={model} />}\n'),
          ]
          for old, new in replacements:
              if old not in updated:
                  raise RuntimeError('expected tab block missing during replacement')
              updated = updated.replace(old, new, 1)

          source_path.write_text(updated)

          gate = '''import fs from "node:fs";
          import path from "node:path";

          const root = process.cwd();
          const limits = new Map([
            ["src/app/admin/studio/cards/CardAuthoringStudio.tsx", 12000],
            ["src/app/admin/studio/cards/CardIdentityTab.tsx", 12000],
            ["src/app/admin/studio/cards/CardClassificationTab.tsx", 16000],
            ["src/app/admin/studio/cards/CardRulesTab.tsx", 20000],
            ["src/app/admin/studio/cards/CardReleaseTab.tsx", 10000],
          ]);

          for (const [rel, maxBytes] of limits) {
            const full = path.join(root, rel);
            const stat = fs.statSync(full);
            if (stat.size > maxBytes) {
              throw new Error(`${rel} is ${stat.size} bytes; structural limit is ${maxBytes}`);
            }
          }

          const shell = fs.readFileSync(path.join(root, "src/app/admin/studio/cards/CardAuthoringStudio.tsx"), "utf8");
          for (const forbidden of ["Sentinela (Planeswalker)", "Combat Profile", "Release Identity", "Regional identity"]) {
            if (shell.includes(forbidden)) throw new Error(`CardAuthoringStudio shell absorbed tab concern: ${forbidden}`);
          }

          console.log("CARD STUDIO STRUCTURE: PASS (shell and tab modules remain bounded)");
          '''
          Path('scripts/studio-structure-gate.mjs').write_text(textwrap.dedent(gate))

          package_path = Path('package.json')
          package_text = package_path.read_text()
          package_needle = '    "audit:engineering-integrity-static": "node scripts/source-contracts-2.97.mjs",\n'
          if package_needle not in package_text:
              raise RuntimeError('package script insertion point missing')
          package_text = package_text.replace(
              package_needle,
              package_needle + '    "audit:studio-structure": "node scripts/studio-structure-gate.mjs",\n',
              1,
          )
          verify_needle = 'npm run audit:source-contracts && npm run typecheck'
          if verify_needle not in package_text:
              raise RuntimeError('production verify insertion point missing')
          package_text = package_text.replace(
              verify_needle,
              'npm run audit:source-contracts && npm run audit:studio-structure && npm run typecheck',
              1,
          )
          package_path.write_text(package_text)

          ci_path = Path('.github/workflows/ci.yml')
          ci = ci_path.read_text()
          ci_needle = '      - name: Typecheck\n        run: npm run typecheck\n'
          if ci_needle not in ci:
              raise RuntimeError('CI insertion point missing')
          ci = ci.replace(
              ci_needle,
              '      - name: Card Studio structure guard\n        run: npm run audit:studio-structure\n\n' + ci_needle,
              1,
          )
          ci_path.write_text(ci)
          PY

      - name: Verify transformed source
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run audit:studio-structure
          npm run typecheck
          npm run lint -- --max-warnings 0
          npm run test:card-authoring
          npm run test:studio-runtime
          npm run audit:source-contracts
          git diff --check

      - name: Remove temporary workflow and commit
        run: |
          git rm .github/workflows/card-studio-refactor-temp.yml
          expected='^.github/workflows/card-studio-refactor-temp.yml$|^.github/workflows/ci.yml$|^package.json$|^scripts/studio-structure-gate.mjs$|^src/app/admin/studio/cards/CardAuthoringModel.ts$|^src/app/admin/studio/cards/CardAuthoringStudio.tsx$|^src/app/admin/studio/cards/CardClassificationTab.tsx$|^src/app/admin/studio/cards/CardIdentityTab.tsx$|^src/app/admin/studio/cards/CardReleaseTab.tsx$|^src/app/admin/studio/cards/CardRulesTab.tsx$'
          unexpected=$(git status --porcelain | sed 's/^...//' | grep -Ev "$expected" || true)
          test -z "$unexpected" || { echo "Unexpected changed files:"; echo "$unexpected"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml package.json scripts/studio-structure-gate.mjs src/app/admin/studio/cards
          git commit -m "refactor(studio): split card authoring tabs into bounded modules"
          git push origin HEAD:engineering/card-studio-modularity-2.97.5
