name: Vanilla 1.7 Balance Diagnostic

on:
  push:
    branches: ['feat/vanilla-1-7-emberhold-vanguard-ascendant-floor']

permissions:
  contents: read

concurrency:
  group: vanilla-1-7-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          package-manager-cache: false

      - name: Install dependencies
        run: npm run ci:install

      - name: Run Vanilla 1.7 recipe laboratory
        run: node --import tsx scripts/vanilla-1-7-balance-diagnostic.ts 16 3 --write artifacts/vanilla-1-7/recipe-screen.json

      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vanilla-1-7-recipe-screen-${{ github.sha }}
          path: artifacts/vanilla-1-7
          if-no-files-found: error
          retention-days: 7
