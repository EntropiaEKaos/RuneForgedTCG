name: Alpha Starter Balance Evidence

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alpha-starter-balance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          package-manager-cache: false

      - name: Install dependencies
        run: npm run ci:install

      - name: Typecheck
        run: npm run typecheck

      - name: Certify starter balance contract
        run: node --import tsx src/game/alpha-starter-balance.test.ts

      - name: Run 3,000-game Alpha starter evidence matrix
        run: |
          mkdir -p artifacts/alpha-balance
          node --import tsx scripts/alpha-starter-balance-audit.ts 40 5 \
            --write artifacts/alpha-balance/ALPHA_STARTER_BALANCE_1.0.json \
            --enforce-quality

      - name: Upload Alpha starter balance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: alpha-starter-balance-${{ github.sha }}
          path: artifacts/alpha-balance/ALPHA_STARTER_BALANCE_1.0.json
          if-no-files-found: error
          retention-days: 14
