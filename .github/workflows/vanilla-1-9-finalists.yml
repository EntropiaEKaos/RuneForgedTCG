name: Vanilla 1.9 Florestia Finalists

on:
  push:
    branches:
      - engineering/vanilla-1-9-floor-convergence
    paths:
      - "scripts/vanilla-1-9-florestia-finalists.ts"
      - ".github/workflows/vanilla-1-9-finalists.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vanilla-1-9-finalists-${{ github.ref }}
  cancel-in-progress: true

jobs:
  confirm:
    name: confirm three Florestia finalists
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.2
          package-manager-cache: false

      - name: Install dependencies
        run: npm run ci:install

      - name: Typecheck finalist lab
        run: npm run typecheck

      - name: Run 6,600-game finalist confirmation
        run: |
          mkdir -p artifacts/vanilla-1-9
          node --import tsx scripts/vanilla-1-9-florestia-finalists.ts \
            --write artifacts/vanilla-1-9/VANILLA_1.9_FLORESTIA_FINALISTS.json

      - name: Upload finalist evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vanilla-1-9-florestia-finalists-${{ github.sha }}
          path: artifacts/vanilla-1-9/VANILLA_1.9_FLORESTIA_FINALISTS.json
          if-no-files-found: error
          retention-days: 14
