name: CI

on:
  push:
    branches: [main, master, 'engineering/**']
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_DB: runeforge_ci
          POSTGRES_USER: runeforge
          POSTGRES_PASSWORD: runeforge_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U runeforge -d runeforge_ci"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      DATABASE_URL: postgresql://runeforge:runeforge_ci_only@localhost:5432/runeforge_ci
      NODE_ENV: test
      PLAYER_SESSION_SECRET: ci-player-session-secret-github-actions-0001
      ADMIN_SESSION_SECRET: ci-admin-session-secret-github-actions-0002
      MFA_ENCRYPTION_KEY: ci-mfa-encryption-key-github-actions-000003
      PAYMENT_ENCRYPTION_KEY: ci-payment-encryption-key-github-actions-0004
      ADMIN_PASSWORD: ci-only-admin-password-not-for-prod-use
      TRUST_PROXY: "false"
      ALLOW_LEGACY_PLAYER_IDENTITY: "false"
      RANKED_RELEASE_CERTIFIED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          package-manager-cache: false

      - name: Install dependencies
        run: npm run ci:install

      - name: Runtime + dependency lock gate
        run: npm run release:runtime-gate

      - name: Ranked release gate
        run: npm run release:ranked-gate

      - name: Local import integrity
        run: npm run test:local-imports

      - name: Test taxonomy guard
        run: npm run audit:test-taxonomy

      - name: Static source/schema audits (not behavioral certification)
        run: |
          npm run audit:schema-static
          npm run audit:source-contracts

      - name: Card Studio structure guard
        run: npm run audit:studio-structure

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Fresh PostgreSQL bootstrap
        run: npm run db:bootstrap

      - name: Mercado Pago PostgreSQL certification — exactly-once, financial state and rotation safety
        env:
          NODE_PATH: ${{ github.workspace }}/scripts/test-runtime
        run: |
          node --import tsx scripts/mercado-pago-postgres-certification.ts
          node --import tsx scripts/mercado-pago-rotation-certification.ts

      - name: Studio functional certification — persisted publish, catalog, deck and engine lifecycle
        env:
          NODE_PATH: ${{ github.workspace }}/scripts/test-runtime
        run: node --import tsx scripts/studio-functional-certification-2.97.6.ts

      - name: Studio version rollback certification — immutable history and coupled card metadata
        env:
          NODE_PATH: ${{ github.workspace }}/scripts/test-runtime
        run: node --import tsx scripts/studio-version-rollback-certification-2.97.7.ts

      - name: Super Admin security certification — step-up, rate limits and sensitive surfaces
        env:
          NODE_PATH: ${{ github.workspace }}/scripts/test-runtime
        run: node --import tsx scripts/super-admin-security-certification-2.97.8.ts

      - name: Behavioral test suite
        run: npm run test:behavior

      - name: Behavioral game-engine coverage gate
        env:
          MIN_FUNCTION_COVERAGE: "70"
        run: npm run test:coverage

      - name: Production PostgreSQL behavior/integrity/concurrency probes
        run: npm run test:production-db

      - name: Build
        env:
          NEXT_PUBLIC_APP_URL: https://ci.placeholder.invalid
        run: npm run build

      - name: HTTP/browser E2E — alpha journey, Studio authoring, recovery, Ranked fail-closed, casual matchmaking, two-browser PvP and DTO isolation
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
        run: |
          npm start > /tmp/runeforge-next.log 2>&1 &
          NEXT_PID=$!
          trap 'status=$?; if [ "$status" -ne 0 ]; then echo "--- Next server log ---"; cat /tmp/runeforge-next.log; fi; kill $NEXT_PID 2>/dev/null || true; exit "$status"' EXIT
          for i in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null; then break; fi
            if [ "$i" = "45" ]; then cat /tmp/runeforge-next.log; exit 1; fi
            sleep 1
          done
          npm run test:e2e:alpha-journey
          npm run test:e2e:http
          node scripts/alpha-pvp-lobby-preflight.mjs
          node scripts/alpha-visual-journey.mjs
          node scripts/alpha-runtime-tooltip-cert.mjs
          node scripts/alpha-activated-ability-browser-cert.mjs
          node scripts/alpha-casual-pvp-journey.mjs
          node scripts/studio-card-rules-rbac-browser-cert.mjs

      - name: Upload Alpha visual journey
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: alpha-visual-journey-${{ github.sha }}
          path: artifacts/alpha-visual
          if-no-files-found: error
          retention-days: 14