name: Temporary Card Studio Export

on:
  push:
    branches:
      - engineering/card-studio-modularity-2.97.5

permissions:
  contents: write

concurrency:
  group: card-studio-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reproduce validated transform
        run: |
          python <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/card-studio-refactor-v5-temp.yml').read_text()
          marker = "          python <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index('\n          PY', start)
          exec(compile(textwrap.dedent(workflow[start:end]), 'card-studio-refactor-v5-transform.py', 'exec'))
          PY

      - name: Verify exact validated file content
        run: |
          sha256sum -c <<'EOF'
          62a1143e4adb5b03cb16ca2d77b84898f8bf9852f83480b7dcdeecbc33c304b8  .github/workflows/ci.yml
          c509b0723895fbb50f28ece8958f743178be5a5b05cbb158a8199a04e2f1a85a  package.json
          9e7fbeb9929c238ef964177b44722d5ba27b18a1cca37e4eca7a46a161921763  scripts/studio-structure-gate.mjs
          e77c7679e0c87f1d7b54f4888f60b88e256bbe65ad26333efdc190ce4886b2a4  src/lib/card-studio-4.1-2.75.test.ts
          308043ad8354089b19feffdd23239686611d22f25bfecc7f932ec622861bc1a9  src/lib/evolution-2.87.test.ts
          269d70411355954340094039ca873542e7e25fa6b4238e88b2617f3858d17ef5  src/lib/growth-commerce-2.93.test.ts
          93a7ceeb121a6a58b4a7de488f191ce7bf578c3d58c833e0f68fafa333f248a9  src/app/admin/studio/cards/CardAuthoringModel.ts
          6a548dfbd7011d3947df0fb7b5a890b50d70be257a589bedc680c81e55020e34  src/app/admin/studio/cards/CardAuthoringStudio.tsx
          c4ee476f5607335f00cf661320d5e90e32405d5ef183cd0f7cb173badf98af0d  src/app/admin/studio/cards/CardClassificationTab.tsx
          cec6ffa10d4b3e0be405b4756afad6070da151ab68d3888ed9ac506b41f9d059  src/app/admin/studio/cards/CardIdentityTab.tsx
          fda4406e1a893cc0c20a7e159324d123805f532771ef16e08faa1b0406c26f0e  src/app/admin/studio/cards/CardReleaseTab.tsx
          0ffed4a2e317dc9830a295f0c7598d1f0dc346d938aa9c97bf1fa7c6b2d6ee8f  src/app/admin/studio/cards/CardRulesTab.tsx
          EOF

      - name: Commit product refactor without workflow mutations
        run: |
          git restore .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            package.json \
            scripts/studio-structure-gate.mjs \
            src/lib/card-studio-4.1-2.75.test.ts \
            src/lib/evolution-2.87.test.ts \
            src/lib/growth-commerce-2.93.test.ts \
            src/app/admin/studio/cards/CardAuthoringModel.ts \
            src/app/admin/studio/cards/CardAuthoringStudio.tsx \
            src/app/admin/studio/cards/CardClassificationTab.tsx \
            src/app/admin/studio/cards/CardIdentityTab.tsx \
            src/app/admin/studio/cards/CardReleaseTab.tsx \
            src/app/admin/studio/cards/CardRulesTab.tsx
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 11
          git commit -m "refactor(studio): split card authoring tabs into bounded modules"
          git push origin HEAD:engineering/card-studio-modularity-2.97.5
