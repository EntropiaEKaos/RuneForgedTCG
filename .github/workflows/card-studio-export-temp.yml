name: Temporary Card Studio Export

on:
  push:
    branches:
      - engineering/card-studio-modularity-2.97.5

permissions:
  contents: read

concurrency:
  group: card-studio-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reproduce validated transform
        run: |
          python <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/card-studio-refactor-v5-temp.yml').read_text()
          marker = "          python <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index('\n          PY', start)
          exec(compile(textwrap.dedent(workflow[start:end]), 'card-studio-refactor-v5-transform.py', 'exec'))
          PY

      - name: Package exact transformed files
        run: |
          tar -czf card-studio-refactor-validated.tar.gz \
            .github/workflows/ci.yml \
            package.json \
            scripts/studio-structure-gate.mjs \
            src/lib/card-studio-4.1-2.75.test.ts \
            src/lib/evolution-2.87.test.ts \
            src/lib/growth-commerce-2.93.test.ts \
            src/app/admin/studio/cards/CardAuthoringModel.ts \
            src/app/admin/studio/cards/CardAuthoringStudio.tsx \
            src/app/admin/studio/cards/CardClassificationTab.tsx \
            src/app/admin/studio/cards/CardIdentityTab.tsx \
            src/app/admin/studio/cards/CardReleaseTab.tsx \
            src/app/admin/studio/cards/CardRulesTab.tsx
          sha256sum card-studio-refactor-validated.tar.gz

      - name: Upload validated refactor
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: card-studio-refactor-validated
          path: card-studio-refactor-validated.tar.gz
          retention-days: 1
          if-no-files-found: error
