name: FX Foundation

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/game/fx-*.ts'
      - 'src/hooks/useGameFx.ts'
      - 'scripts/fx-foundation-harness.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/fx-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fx-foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          package-manager-cache: false

      - name: Install dependencies from lockfile
        run: npm run ci:install

      - name: Runtime and lockfile gate
        run: npm run release:runtime-gate

      - name: Typecheck
        run: npm run typecheck

      - name: FX foundation harness
        run: node --import tsx scripts/fx-foundation-harness.ts

      - name: Production build
        run: npm run build
