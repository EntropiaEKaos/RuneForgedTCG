name: Temporary Card Studio Refactor V3

on:
  push:
    branches:
      - engineering/card-studio-modularity-2.97.5

permissions:
  contents: write

concurrency:
  group: card-studio-refactor-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          package-manager-cache: false

      - name: Run corrected deterministic transform
        run: |
          python <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/card-studio-refactor-temp.yml').read_text()
          workflow = workflow.replace(
              'auth, rows, card, id, tab, setTab, tests, testBusy, setTestBusy, testName, setTestName,',
              'auth, rows, card, cm, id, tab, setTab, tests, testBusy, setTestBusy, testName, setTestName,',
              1,
          )
          marker = "          python <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index('\n          PY', start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, 'card-studio-refactor-transform.py', 'exec'))

          test_path = Path('src/lib/card-studio-4.1-2.75.test.ts')
          test = test_path.read_text()
          old = 'const studio = source("src/app/admin/studio/cards/CardAuthoringStudio.tsx") + source("src/app/admin/studio/cards/CardAuthoringFields.tsx") + source("src/app/admin/studio/cards/useCardAuthoringModel.ts");'
          new = '''const studio = [
            "CardAuthoringStudio.tsx",
            "CardAuthoringFields.tsx",
            "useCardAuthoringModel.ts",
            "CardIdentityTab.tsx",
            "CardClassificationTab.tsx",
            "CardRulesTab.tsx",
            "CardReleaseTab.tsx",
          ].map((file) => source(`src/app/admin/studio/cards/${file}`)).join("\\n");'''
          if old not in test:
              raise RuntimeError('Card Studio source contract insertion point missing')
          test_path.write_text(test.replace(old, new, 1))
          PY

      - name: Verify transformed source
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run audit:studio-structure
          npm run typecheck
          npm run lint -- --max-warnings 0
          npm run test:card-authoring
          npm run test:card-studio-4.1
          npm run test:studio-runtime
          npm run audit:source-contracts
          git diff --check

      - name: Remove temporary workflows and commit
        run: |
          git rm .github/workflows/card-studio-refactor-temp.yml .github/workflows/card-studio-refactor-v2-temp.yml .github/workflows/card-studio-refactor-v3-temp.yml
          expected='^.github/workflows/card-studio-refactor-temp.yml$|^.github/workflows/card-studio-refactor-v2-temp.yml$|^.github/workflows/card-studio-refactor-v3-temp.yml$|^.github/workflows/ci.yml$|^package.json$|^scripts/studio-structure-gate.mjs$|^src/lib/card-studio-4.1-2.75.test.ts$|^src/app/admin/studio/cards/CardAuthoringModel.ts$|^src/app/admin/studio/cards/CardAuthoringStudio.tsx$|^src/app/admin/studio/cards/CardClassificationTab.tsx$|^src/app/admin/studio/cards/CardIdentityTab.tsx$|^src/app/admin/studio/cards/CardReleaseTab.tsx$|^src/app/admin/studio/cards/CardRulesTab.tsx$'
          unexpected=$(git status --porcelain | sed 's/^...//' | grep -Ev "$expected" || true)
          test -z "$unexpected" || { echo "Unexpected changed files:"; echo "$unexpected"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml package.json scripts/studio-structure-gate.mjs src/lib/card-studio-4.1-2.75.test.ts src/app/admin/studio/cards
          git commit -m "refactor(studio): split card authoring tabs into bounded modules"
          git push origin HEAD:engineering/card-studio-modularity-2.97.5
