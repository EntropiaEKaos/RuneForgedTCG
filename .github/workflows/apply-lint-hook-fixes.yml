name: Apply hook lint fixes

on:
  push:
    branches: ['engineering/release-hardening-2.97.1']
    paths:
      - .github/workflows/apply-lint-hook-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Apply targeted hook fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          replace_exact(
              "src/app/forge/ForgeClient.tsx",
              "  const synergy = useMemo(() => analyzeDeckSynergy(list), [list, catalogRevision]);",
              "  const synergy = useMemo(() => { void catalogRevision; return analyzeDeckSynergy(list); }, [list, catalogRevision]);",
          )
          replace_exact(
              "src/app/forge/ForgeClient.tsx",
              "  const suggestions = useMemo(() => focusCard ? recommendSynergies(focusCard, 6).filter(x=>!counts.has(x.defId)) : [], [focusCard, counts, catalogRevision]);",
              "  const suggestions = useMemo(() => { void catalogRevision; return focusCard ? recommendSynergies(focusCard, 6).filter(x=>!counts.has(x.defId)) : []; }, [focusCard, counts, catalogRevision]);",
          )
          replace_exact(
              "src/app/play/GameClient.tsx",
              "    }).catch(() => {});\n  }, []);\n\n  const startMatch = useMatchLauncher({",
              "    }).catch(() => {});\n  }, [setFxMode]);\n\n  const startMatch = useMatchLauncher({",
          )
          replace_exact(
              "src/app/play/hooks/useMatchLauncher.ts",
              "  }, [actionLogRef, aiDifficulty, modeAttemptTokenRef, modePlayerFirstRef, playerName, resetTransientMatchState, resolvePlayerDeck, savedRef, seedRef, setActiveEncounter, setFirstInfo, setMatchReward, setMatchToken, setPvpConnection, setPvpGuest, setPvpMessage, setPvpRoomCode, setPvpVersion, setScreen, setState]);",
              "  }, [actionLogRef, aiDifficulty, modeAttemptTokenRef, modePlayerFirstRef, playerName, presetDecks, resetTransientMatchState, resolvePlayerDeck, savedRef, seedRef, setActiveEncounter, setFirstInfo, setMatchReward, setMatchToken, setPvpConnection, setPvpGuest, setPvpMessage, setPvpRoomCode, setPvpVersion, setScreen, setState]);",
          )
          replace_exact(
              "src/components/CatalogBootstrap.tsx",
              "  useEffect(() => {\n    void refreshCatalog();",
              "  useDeferredEffect(() => {\n    void refreshCatalog();",
          )
          PY

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/forge/ForgeClient.tsx src/app/play/GameClient.tsx src/app/play/hooks/useMatchLauncher.ts src/components/CatalogBootstrap.tsx
          git diff --cached --check
          git commit -m "fix(react): satisfy hook dependency contracts"
          git push origin HEAD:${GITHUB_REF_NAME}
