name: Vanilla Recipe Bootstrap

on:
  push:
    branches:
      - feat/vanilla-1-4-ascendant-recipe-curve-reconstruction

permissions:
  contents: read

jobs:
  recipe-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - name: Run Vanilla 1.4 behavioral contract
        run: node --import tsx src/game/vanilla-ascendant-recipes-1-4.test.ts
      - name: Validate Vanilla content baseline
        run: node --import tsx scripts/vanilla-content-audit.ts --enforce
