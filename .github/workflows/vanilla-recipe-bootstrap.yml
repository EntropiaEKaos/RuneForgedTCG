name: Vanilla Recipe Bootstrap

on:
  push:
    branches:
      - feat/vanilla-1-4-ascendant-recipe-curve-reconstruction

permissions:
  contents: read

jobs:
  recipe-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - name: Validate finalized Vanilla recipe structure
        run: node --import tsx scripts/vanilla-content-audit.ts --write VANILLA_RECIPE_FINAL_1.4.json --enforce
      - name: Run final utilization matrix
        run: node --import tsx scripts/vanilla-utilization-audit.ts 20 3 --write VANILLA_UTILIZATION_FINAL_1.4.json --enforce
      - name: Run final full Balance Lab
        run: node --import tsx scripts/vanilla-balance-audit.ts 40 5 --write VANILLA_BALANCE_FINAL_1.4.json --enforce
      - uses: actions/upload-artifact@v4
        with:
          name: vanilla-recipe-final-audits-1-4
          path: |
            VANILLA_RECIPE_FINAL_1.4.json
            VANILLA_UTILIZATION_FINAL_1.4.json
            VANILLA_BALANCE_FINAL_1.4.json
          if-no-files-found: error
