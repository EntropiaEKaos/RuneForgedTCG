name: Vanilla 1.9 Official Audit

on:
  push:
    branches:
      - engineering/vanilla-1-9-floor-convergence

permissions:
  contents: read

jobs:
  official-vanilla-balance-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.2
          package-manager-cache: false

      - name: Install dependencies
        run: npm run ci:install

      - name: Typecheck promoted recipe
        run: npm run typecheck

      - name: Run official Vanilla Balance Lab
        run: npm run audit:vanilla-balance

      - name: Upload official audit evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vanilla-1-9-official-audit-${{ github.sha }}
          path: VANILLA_BALANCE_AUDIT_1.1.json
          if-no-files-found: error
          retention-days: 14
