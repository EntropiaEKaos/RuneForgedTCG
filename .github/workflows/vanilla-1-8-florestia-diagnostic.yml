name: Vanilla 1.8 Florestia Certification

on:
  push:
    branches:
      - feat/vanilla-1-8-florestia-ascendant-floor
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - run: npm run ci:install
      - name: TypeScript
        run: npm run typecheck
      - name: Behavioral suite
        run: npm run test:behavior
      - name: Official 13,200-game Balance Lab
        run: node --import tsx scripts/vanilla-balance-audit.ts 40 5 --write VANILLA_BALANCE_AUDIT_1.8.json --enforce --print-full
      - name: Upload certification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vanilla-1-8-florestia-certification
          path: VANILLA_BALANCE_AUDIT_1.8.json
          if-no-files-found: error
          retention-days: 7
