name: Condition 2.6 Bootstrap

on:
  push:
    branches: [feat/condition-2-6-permanent-board-thresholds]

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/condition-2-6-permanent-board-thresholds
          persist-credentials: true

      - name: Apply Condition 2.6 slice
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected patch anchor not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          # Typed contract.
          replace_once(
              "src/game/types.ts",
              '  | { kind: "allyUnitsAtLeast"; min: number }\n  | { kind: "enemyUnitsAtLeast"; min: number }\n  | { kind: "nexusBelow"; amount: number }',
              '  | { kind: "allyUnitsAtLeast"; min: number }\n  | { kind: "enemyUnitsAtLeast"; min: number }\n  | { kind: "allyPermanentsAtLeast"; min: number }\n  | { kind: "enemyPermanentsAtLeast"; min: number }\n  | { kind: "nexusBelow"; amount: number }',
          )

          replace_once(
              "src/game/card-authoring.ts",
              'export const MECHANIC_CONDITION_KINDS = ["always","selfDamaged","allyRace","allyClass","enemyRace","enemyClass","allyUnitsAtLeast","enemyUnitsAtLeast","nexusBelow","opponentNexusBelow","manaAtLeast","handAtLeast","opponentHandAtLeast","roundAtLeast","and","or","not"] as const;',
              'export const MECHANIC_CONDITION_KINDS = ["always","selfDamaged","allyRace","allyClass","enemyRace","enemyClass","allyUnitsAtLeast","enemyUnitsAtLeast","allyPermanentsAtLeast","enemyPermanentsAtLeast","nexusBelow","opponentNexusBelow","manaAtLeast","handAtLeast","opponentHandAtLeast","roundAtLeast","and","or","not"] as const;',
          )
          replace_once(
              "src/game/card-authoring.ts",
              '  if (kind === "allyUnitsAtLeast" || kind === "enemyUnitsAtLeast") return { kind, min: Math.max(1, Math.min(6, Math.trunc(finite(c.min, 1)))) } as MechanicCondition;\n  if (kind === "nexusBelow"',
              '  if (kind === "allyUnitsAtLeast" || kind === "enemyUnitsAtLeast") return { kind, min: Math.max(1, Math.min(6, Math.trunc(finite(c.min, 1)))) } as MechanicCondition;\n  if (kind === "allyPermanentsAtLeast" || kind === "enemyPermanentsAtLeast") return { kind, min: Math.max(1, Math.min(8, Math.trunc(finite(c.min, 1)))) } as MechanicCondition;\n  if (kind === "nexusBelow"',
          )

          replace_once(
              "src/game/condition-contract.ts",
              '  allyUnitsAtLeast: { kind: "allyUnitsAtLeast", min: 1 },\n  enemyUnitsAtLeast: { kind: "enemyUnitsAtLeast", min: 1 },\n  nexusBelow:',
              '  allyUnitsAtLeast: { kind: "allyUnitsAtLeast", min: 1 },\n  enemyUnitsAtLeast: { kind: "enemyUnitsAtLeast", min: 1 },\n  allyPermanentsAtLeast: { kind: "allyPermanentsAtLeast", min: 1 },\n  enemyPermanentsAtLeast: { kind: "enemyPermanentsAtLeast", min: 1 },\n  nexusBelow:',
          )

          # Authoritative mechanics evaluator: only living Permanents in the dedicated permanent zone.
          replace_once(
              "src/game/engine/effects.ts",
              '  if (condition.kind === "allyUnitsAtLeast") return p.bench.filter((u) => u.health > 0).length >= condition.min;\n  if (condition.kind === "enemyUnitsAtLeast") return opponent.bench.filter((u) => u.health > 0).length >= condition.min;\n  if (condition.kind === "nexusBelow")',
              '  if (condition.kind === "allyUnitsAtLeast") return p.bench.filter((u) => u.health > 0).length >= condition.min;\n  if (condition.kind === "enemyUnitsAtLeast") return opponent.bench.filter((u) => u.health > 0).length >= condition.min;\n  if (condition.kind === "allyPermanentsAtLeast") return p.permanents.filter((permanent) => permanent.health > 0).length >= condition.min;\n  if (condition.kind === "enemyPermanentsAtLeast") return opponent.permanents.filter((permanent) => permanent.health > 0).length >= condition.min;\n  if (condition.kind === "nexusBelow")',
          )

          # Continuous Aura contract/runtime.
          replace_once(
              "src/game/aura-condition-contract.ts",
              '  "allyUnitsAtLeast",\n  "enemyUnitsAtLeast",\n  "nexusBelow",',
              '  "allyUnitsAtLeast",\n  "enemyUnitsAtLeast",\n  "allyPermanentsAtLeast",\n  "enemyPermanentsAtLeast",\n  "nexusBelow",',
          )
          replace_once(
              "src/game/aura-condition-contract.ts",
              '  if (condition.kind === "allyUnitsAtLeast") return player.bench.filter((unit) => unit.health > 0).length >= condition.min;\n  if (condition.kind === "enemyUnitsAtLeast") return enemy.bench.filter((unit) => unit.health > 0).length >= condition.min;\n  if (condition.kind === "nexusBelow")',
              '  if (condition.kind === "allyUnitsAtLeast") return player.bench.filter((unit) => unit.health > 0).length >= condition.min;\n  if (condition.kind === "enemyUnitsAtLeast") return enemy.bench.filter((unit) => unit.health > 0).length >= condition.min;\n  if (condition.kind === "allyPermanentsAtLeast") return player.permanents.filter((permanent) => permanent.health > 0).length >= condition.min;\n  if (condition.kind === "enemyPermanentsAtLeast") return enemy.permanents.filter((permanent) => permanent.health > 0).length >= condition.min;\n  if (condition.kind === "nexusBelow")',
          )

          # Studio — generic Mechanics condition editor.
          replace_once(
              "src/app/admin/studio/AbilityComposerFields.tsx",
              '  if (kind === "allyUnitsAtLeast" || kind === "enemyUnitsAtLeast") return { kind, min: 1 } as MechanicCondition;\n  if (kind === "nexusBelow"',
              '  if (kind === "allyUnitsAtLeast" || kind === "enemyUnitsAtLeast" || kind === "allyPermanentsAtLeast" || kind === "enemyPermanentsAtLeast") return { kind, min: 1 } as MechanicCondition;\n  if (kind === "nexusBelow"',
          )
          replace_once(
              "src/app/admin/studio/AbilityComposerFields.tsx",
              '      {(kind === "allyUnitsAtLeast" || kind === "enemyUnitsAtLeast") && <Field label={kind === "allyUnitsAtLeast" ? "Living allied Units ≥" : "Living enemy Units ≥"}><input className="input" type="number" min={1} max={6} value={(value as Extract<MechanicCondition, { kind: "allyUnitsAtLeast" | "enemyUnitsAtLeast" }>).min ?? 1} onChange={(event) => onChange({ ...(value as Extract<MechanicCondition, { kind: "allyUnitsAtLeast" | "enemyUnitsAtLeast" }>), min: Number(event.target.value) })} /></Field>}\n',
              '      {(kind === "allyUnitsAtLeast" || kind === "enemyUnitsAtLeast") && <Field label={kind === "allyUnitsAtLeast" ? "Living allied Units ≥" : "Living enemy Units ≥"}><input className="input" type="number" min={1} max={6} value={(value as Extract<MechanicCondition, { kind: "allyUnitsAtLeast" | "enemyUnitsAtLeast" }>).min ?? 1} onChange={(event) => onChange({ ...(value as Extract<MechanicCondition, { kind: "allyUnitsAtLeast" | "enemyUnitsAtLeast" }>), min: Number(event.target.value) })} /></Field>}\n      {(kind === "allyPermanentsAtLeast" || kind === "enemyPermanentsAtLeast") && <Field label={kind === "allyPermanentsAtLeast" ? "Living allied Permanents ≥" : "Living enemy Permanents ≥"}><input className="input" type="number" min={1} max={8} value={(value as Extract<MechanicCondition, { kind: "allyPermanentsAtLeast" | "enemyPermanentsAtLeast" }>).min ?? 1} onChange={(event) => onChange({ ...(value as Extract<MechanicCondition, { kind: "allyPermanentsAtLeast" | "enemyPermanentsAtLeast" }>), min: Number(event.target.value) })} /></Field>}\n',
          )

          # Studio — Continuous Aura condition editor.
          replace_once(
              "src/app/admin/studio/cards/ContinuousAuraConditionEditor.tsx",
              '  if (kind === "allyUnitsAtLeast" || kind === "enemyUnitsAtLeast") return { kind, min: 1 } as MechanicCondition;\n  if (kind === "nexusBelow"',
              '  if (kind === "allyUnitsAtLeast" || kind === "enemyUnitsAtLeast" || kind === "allyPermanentsAtLeast" || kind === "enemyPermanentsAtLeast") return { kind, min: 1 } as MechanicCondition;\n  if (kind === "nexusBelow"',
          )
          replace_once(
              "src/app/admin/studio/cards/ContinuousAuraConditionEditor.tsx",
              '        {(kind === "allyUnitsAtLeast" || kind === "enemyUnitsAtLeast") && <label className="block"><span className="label">{kind === "allyUnitsAtLeast" ? "Units aliadas vivas ≥" : "Units inimigas vivas ≥"}</span><input className="input" type="number" min={1} max={6} value={safeValue.min} onChange={(event) => onChange({ ...safeValue, min: Number(event.target.value) })} /></label>}\n\n',
              '        {(kind === "allyUnitsAtLeast" || kind === "enemyUnitsAtLeast") && <label className="block"><span className="label">{kind === "allyUnitsAtLeast" ? "Units aliadas vivas ≥" : "Units inimigas vivas ≥"}</span><input className="input" type="number" min={1} max={6} value={safeValue.min} onChange={(event) => onChange({ ...safeValue, min: Number(event.target.value) })} /></label>}\n        {(kind === "allyPermanentsAtLeast" || kind === "enemyPermanentsAtLeast") && <label className="block"><span className="label">{kind === "allyPermanentsAtLeast" ? "Permanents aliadas vivas ≥" : "Permanents inimigas vivas ≥"}</span><input className="input" type="number" min={1} max={8} value={safeValue.min} onChange={(event) => onChange({ ...safeValue, min: Number(event.target.value) })} /></label>}\n\n',
          )

          # Studio explanatory surface.
          replace_once(
              "src/app/admin/studio/cards/PermanentAuraEditor.tsx",
              'eyebrow="CONDITION 2.5 — ROUND THRESHOLD"',
              'eyebrow="CONDITION 2.6 — PERMANENT BOARD THRESHOLDS"',
          )
          p = Path("src/app/admin/studio/cards/PermanentAuraEditor.tsx")
          text = p.read_text()
          text = text.replace(
              "quantidade de Units vivas aliadas ou inimigas, rodada atual",
              "quantidade de Units vivas aliadas ou inimigas, quantidade de Permanents vivas aliadas ou inimigas, rodada atual",
          )
          p.write_text(text)

          # Existing Aura contract regression expectation.
          replace_once(
              "src/game/aura-2-5-conditional-auras.test.ts",
              '  conditions: ["always", "allyRace", "allyClass", "enemyRace", "enemyClass", "allyUnitsAtLeast", "enemyUnitsAtLeast", "nexusBelow", "opponentNexusBelow", "manaAtLeast", "handAtLeast", "opponentHandAtLeast", "roundAtLeast", "and", "or", "not"],',
              '  conditions: ["always", "allyRace", "allyClass", "enemyRace", "enemyClass", "allyUnitsAtLeast", "enemyUnitsAtLeast", "allyPermanentsAtLeast", "enemyPermanentsAtLeast", "nexusBelow", "opponentNexusBelow", "manaAtLeast", "handAtLeast", "opponentHandAtLeast", "roundAtLeast", "and", "or", "not"],',
          )

          # Behavioral suite becomes 73 targets by adding the new certification.
          replace_once(
              "scripts/test-suites.mjs",
              '  "src/game/condition-2-5-round-threshold.test.ts",\n',
              '  "src/game/condition-2-5-round-threshold.test.ts",\n  "src/game/condition-2-6-permanent-board-thresholds.test.ts",\n',
          )

          test = r'''import assert from "node:assert/strict";
          import "./aura-2-types";
          import {
            ABILITY_GRAMMAR_CATALOG,
            blueprintFromPermanentStatAura,
          } from "./ability-system";
          import { auraConditionMatches } from "./aura-condition-contract";
          import {
            MECHANIC_CONDITION_KINDS,
            sanitizeMechanicCondition,
            validateAuthorableCard,
          } from "./card-authoring";
          import {
            CONDITION_RUNTIME_SUPPORT,
            conditionKindsAtDepth,
          } from "./condition-contract";
          import { withRegisteredCardSnapshot } from "./custom-registry";
          import { DECKS } from "./decks";
          import {
            cleanupDead,
            createGame,
            makePermanent,
            makeUnit,
            mechanicConditionMatches,
            playUnit,
            recomputeContinuousAuras,
          } from "./engine";
          import { validateAuthorableCardWithSemanticTypes } from "./semantic-card-type-authoring";
          import type { CardDef, MechanicCondition, PermanentStatAura } from "./types";

          const unitCard = (defId: string, mechanics?: CardDef["mechanics"]): CardDef => ({
            defId,
            name: defId,
            region: "Ironwood",
            type: "Unit",
            cost: 1,
            power: 2,
            health: 4,
            race: "Spirit",
            ...(mechanics?.length ? { mechanics } : {}),
            description: "Condition 2.6 permanent-board threshold test unit.",
            rarity: "Common",
            emoji: "🛡️",
          });

          const permanentCard = (
            defId: string,
            type: "Artifact" | "Enchantment" = "Artifact",
            aura?: PermanentStatAura,
            structure = false,
          ): CardDef => ({
            defId,
            name: defId,
            region: "Ironwood",
            type,
            cost: 1,
            maxHealth: 4,
            ...(aura ? { aura } : {}),
            ...(structure ? { archetypeKey: "structure", archetypeName: "Estrutura" } : {}),
            description: "Condition 2.6 test Permanent.",
            rarity: "Common",
            emoji: structure ? "🏰" : "⚙️",
          });

          assert.equal(MECHANIC_CONDITION_KINDS.includes("allyPermanentsAtLeast"), true);
          assert.equal(MECHANIC_CONDITION_KINDS.includes("enemyPermanentsAtLeast"), true);
          assert.equal(CONDITION_RUNTIME_SUPPORT.allyPermanentsAtLeast, "supported");
          assert.equal(CONDITION_RUNTIME_SUPPORT.enemyPermanentsAtLeast, "supported");
          assert.equal(conditionKindsAtDepth(0).includes("allyPermanentsAtLeast"), true);
          assert.equal(conditionKindsAtDepth(0).includes("enemyPermanentsAtLeast"), true);
          assert.equal(ABILITY_GRAMMAR_CATALOG.conditions.includes("allyPermanentsAtLeast"), true);
          assert.equal(ABILITY_GRAMMAR_CATALOG.conditions.includes("enemyPermanentsAtLeast"), true);
          assert.equal(ABILITY_GRAMMAR_CATALOG.conditionContracts.allyPermanentsAtLeast, "supported");
          assert.equal(ABILITY_GRAMMAR_CATALOG.conditionContracts.enemyPermanentsAtLeast, "supported");

          assert.deepEqual(
            sanitizeMechanicCondition({ kind: "allyPermanentsAtLeast", min: 99 }),
            { kind: "allyPermanentsAtLeast", min: 8 },
            "Permanent threshold follows the configurable permanentsCap authoring envelope 1..8",
          );
          assert.deepEqual(
            sanitizeMechanicCondition({ kind: "enemyPermanentsAtLeast", min: 0 }),
            { kind: "enemyPermanentsAtLeast", min: 1 },
          );
          assert.deepEqual(
            sanitizeMechanicCondition({ kind: "not", child: { kind: "enemyPermanentsAtLeast", min: 3 } }),
            { kind: "not", child: { kind: "enemyPermanentsAtLeast", min: 3 } },
          );

          // Generic Mechanics is controller-oriented, counts only living Permanents, includes Structures,
          // and never reads Sentinelas because they live in their own zone.
          withRegisteredCardSnapshot([
            unitCard("test_condition26_source"),
            permanentCard("test_condition26_artifact"),
            permanentCard("test_condition26_structure", "Artifact", undefined, true),
            permanentCard("test_condition26_enemy_a", "Enchantment"),
            permanentCard("test_condition26_enemy_b", "Artifact"),
          ], () => {
            const state = createGame("Condition 2.6 Mechanics Orientation", DECKS[3], DECKS[2], true, 626001);
            const playerSource = makeUnit(state, "test_condition26_source", "player");
            const aiSource = makeUnit(state, "test_condition26_source", "ai");
            state.players.player.bench = [playerSource];
            state.players.ai.bench = [aiSource];
            state.players.player.permanents = [
              makePermanent(state, "test_condition26_artifact", "player"),
              makePermanent(state, "test_condition26_structure", "player"),
            ];
            state.players.ai.permanents = [
              makePermanent(state, "test_condition26_enemy_a", "ai"),
              makePermanent(state, "test_condition26_enemy_b", "ai"),
            ];
            state.players.player.sentinelas = [{
              instanceId: "condition26_sentinela",
              defId: "irrelevant_sentinela",
              owner: "player",
              loyalty: 5,
              activatedThisTurn: false,
            }];

            assert.equal(mechanicConditionMatches(state, playerSource, { kind: "allyPermanentsAtLeast", min: 2 }), true, "Artifact-backed Structure counts as a Permanent");
            assert.equal(mechanicConditionMatches(state, playerSource, { kind: "allyPermanentsAtLeast", min: 3 }), false, "Sentinela remains outside the Permanent count");
            assert.equal(mechanicConditionMatches(state, playerSource, { kind: "enemyPermanentsAtLeast", min: 2 }), true);
            assert.equal(mechanicConditionMatches(state, aiSource, { kind: "enemyPermanentsAtLeast", min: 2 }), true, "AI observes the player Permanent board symmetrically");

            state.players.ai.permanents[1].health = 0;
            assert.equal(mechanicConditionMatches(state, playerSource, { kind: "enemyPermanentsAtLeast", min: 2 }), false, "lethal Permanent does not count before physical cleanup");
            const composed: MechanicCondition = {
              kind: "and",
              children: [
                { kind: "allyPermanentsAtLeast", min: 2 },
                { kind: "not", child: { kind: "enemyPermanentsAtLeast", min: 2 } },
              ],
            };
            assert.equal(mechanicConditionMatches(state, playerSource, composed), true);
          });

          // Aura evaluator shares the same controller/opponent orientation and living-Permanent rule.
          withRegisteredCardSnapshot([
            permanentCard("test_condition26_aura_probe"),
            permanentCard("test_condition26_aura_enemy", "Enchantment"),
          ], () => {
            const state = createGame("Condition 2.6 Aura Orientation", DECKS[3], DECKS[2], true, 626002);
            state.players.player.permanents = [makePermanent(state, "test_condition26_aura_probe", "player")];
            state.players.ai.permanents = [makePermanent(state, "test_condition26_aura_enemy", "ai")];
            assert.equal(auraConditionMatches(state, "player", { kind: "allyPermanentsAtLeast", min: 1 }), true);
            assert.equal(auraConditionMatches(state, "player", { kind: "enemyPermanentsAtLeast", min: 1 }), true);
            state.players.ai.permanents[0].health = 0;
            assert.equal(auraConditionMatches(state, "player", { kind: "enemyPermanentsAtLeast", min: 1 }), false);
          });

          // A real Structure entry crosses the threshold immediately; cleanupDead crosses it back down
          // and recomputes the Aura in the same stabilization cycle.
          withRegisteredCardSnapshot([
            permanentCard("test_condition26_threshold_aura", "Enchantment", {
              buffPower: 2,
              buffHealth: 0,
              condition: { kind: "allyPermanentsAtLeast", min: 2 },
            }),
            permanentCard("test_condition26_entering_structure", "Artifact", undefined, true),
            unitCard("test_condition26_ally"),
          ], () => {
            const state = createGame("Condition 2.6 Permanent Lifecycle", DECKS[3], DECKS[2], true, 626003);
            state.players.player.bench = [];
            state.players.player.permanents = [makePermanent(state, "test_condition26_threshold_aura", "player")];
            const ally = makeUnit(state, "test_condition26_ally", "player");
            state.players.player.bench.push(ally);
            state.players.player.hand = [{ instanceId: "condition26_structure_hand", defId: "test_condition26_entering_structure" }];
            state.players.player.mana = 10;
            state.players.player.maxMana = 10;
            state.activePlayer = "player";
            state.phase = "main";
            recomputeContinuousAuras(state);
            assert.equal(ally.power, 2, "Aura source alone is one living Permanent and leaves threshold 2 inactive");

            const resolved = playUnit(state, "player", "condition26_structure_hand");
            const powered = resolved.players.player.bench.find((unit) => unit.instanceId === ally.instanceId)!;
            assert.equal(resolved.players.player.permanents.filter((permanent) => permanent.health > 0).length, 2);
            assert.equal(powered.power, 4, "Structure entry activates the Aura in the returned authoritative state");

            const structure = resolved.players.player.permanents.find((permanent) => permanent.defId === "test_condition26_entering_structure")!;
            structure.health = 0;
            cleanupDead(resolved);
            const stabilized = resolved.players.player.bench.find((unit) => unit.instanceId === ally.instanceId)!;
            assert.equal(resolved.players.player.permanents.filter((permanent) => permanent.health > 0).length, 1);
            assert.equal(stabilized.power, 2, "cleanupDead removes the lethal Permanent and disables the Aura in the same stabilization cycle");
          });

          // Authoring + Ability Grammar preserve both Permanent-threshold leaves through composition.
          const mechanicAuthored = validateAuthorableCard(unitCard("valid_condition26_mechanic", [{
            key: "fortress_watch",
            name: "Fortress Watch",
            trigger: "onRoundStart",
            condition: { kind: "enemyPermanentsAtLeast", min: 3 },
            effect: { kind: "draw", amount: 1, target: "none" },
          }]));
          assert.equal(mechanicAuthored.ok, true);
          assert.ok(mechanicAuthored.ok);
          assert.deepEqual(mechanicAuthored.card.mechanics?.[0].condition, { kind: "enemyPermanentsAtLeast", min: 3 });

          const auraAuthored = validateAuthorableCardWithSemanticTypes(permanentCard(
            "valid_condition26_aura",
            "Enchantment",
            {
              buffPower: 1,
              buffHealth: 0,
              condition: {
                kind: "and",
                children: [
                  { kind: "allyPermanentsAtLeast", min: 2 },
                  { kind: "not", child: { kind: "enemyPermanentsAtLeast", min: 5 } },
                ],
              },
            },
          ));
          assert.equal(auraAuthored.ok, true);
          assert.ok(auraAuthored.ok);
          assert.deepEqual(auraAuthored.card.aura?.condition, {
            kind: "and",
            children: [
              { kind: "allyPermanentsAtLeast", min: 2 },
              { kind: "not", child: { kind: "enemyPermanentsAtLeast", min: 5 } },
            ],
          });
          const blueprint = blueprintFromPermanentStatAura(auraAuthored.card);
          assert.ok(blueprint);
          assert.deepEqual(blueprint.condition, auraAuthored.card.aura?.condition);
          assert.equal(blueprint.features.includes("conditional"), true);

          console.log("CONDITION SYSTEM 2.6: PASS — living allied/enemy Permanent thresholds, 1..8 authoring envelope, Structures, Sentinela exclusion, composition, immediate entry/cleanup Aura lifecycle, authoring and Ability Grammar certified");
          '''
          # Remove indentation introduced by the YAML heredoc Python source.
          import textwrap
          Path("src/game/condition-2-6-permanent-board-thresholds.test.ts").write_text(textwrap.dedent(test).lstrip())

          doc = r'''# Condition System 2.6 — Permanent Board Thresholds

          ## Objetivo

          Condition 2.6 adiciona duas folhas controller-scoped ao vocabulário canônico de condições:

          ```ts
          { kind: "allyPermanentsAtLeast", min: N }
          { kind: "enemyPermanentsAtLeast", min: N }
          ```

          Elas permitem que Mechanics e Continuous Auras respondam à quantidade de Permanents vivas no battlefield sem criar cache, contador derivado ou hook paralelo.

          ## Semântica autoritativa

          Para uma fonte controlada por `player`, `allyPermanentsAtLeast` lê `state.players.player.permanents` e `enemyPermanentsAtLeast` lê `state.players.ai.permanents`. Para uma fonte da IA a orientação é simétrica.

          Só contam instâncias com `health > 0`. Um corpo letal ainda presente no array antes de `cleanupDead()` já deixa de satisfazer o threshold.

          Structures entram naturalmente na contagem porque o contrato semântico `structure` é persistido e executado sobre a base estrutural `Artifact`, portanto sua instância está em `PlayerState.permanents`. Sentinelas não entram: elas possuem a zona dedicada `PlayerState.sentinelas` e nunca são reinterpretadas como Permanent.

          A própria fonte de uma Permanent Aura conta quando estiver viva, porque ela também ocupa a zona `permanents`. Portanto uma Aura com `allyPermanentsAtLeast: 2` ativa quando ela própria e mais uma Permanent viva estiverem presentes.

          ## Envelope de authoring

          `min` é sanitizado para `1..8`. O teto acompanha o envelope administrativo já existente de `permanentsCap`, configurável de 1 a 8. O default atual do jogo continua 4; Condition 2.6 não congela o runtime nesse default.

          Limiares complementares continuam expressáveis por `NOT`, por exemplo:

          ```ts
          { kind: "not", child: { kind: "enemyPermanentsAtLeast", min: 3 } }
          ```

          ## Runtime e lifecycle

          `mechanicConditionMatches()` e `auraConditionMatches()` filtram diretamente as zonas autoritativas de Permanents. Não existe snapshot secundário.

          Entrada de Enchantment, Artifact ou Structure já converge pelos actions certificados para `cleanupDead()`/`recomputeContinuousAuras()`. Da mesma forma, dano/destruição que deixa uma Permanent letal passa pelo mesmo ciclo de estabilização. Assim cruzar o threshold para cima ou para baixo liga/desliga uma Aura imediatamente na state devolvida pela ação.

          Nenhum novo hook de engine, cache de board ou campo de replay foi introduzido.

          ## Studio e Ability Grammar

          Os dois kinds são expostos tanto no `StudioConditionEditor` quanto no `ContinuousAuraConditionEditor`, com input `1..8` e defaults válidos. Eles continuam compondo com `AND`, `OR` e `NOT` nos limites estruturais já certificados.

          `ABILITY_GRAMMAR_CATALOG.conditions` e `conditionContracts` derivam do mesmo vocabulário canônico e publicam ambos como `supported`. `blueprintFromPermanentStatAura()` preserva a árvore de condição sem criar novo rule kind.

          ## Certificação

          `condition-2-6-permanent-board-thresholds.test.ts` cobre:

          - registro canônico e Ability Grammar;
          - clamps `1..8`;
          - orientação player/IA;
          - somente `health > 0`;
          - Structure contando como Permanent;
          - Sentinela excluída;
          - `NOT/AND`;
          - avaliação de Aura;
          - entrada real de Structure ligando Aura imediatamente;
          - `cleanupDead()` removendo a Permanent letal e desligando Aura no mesmo ciclo;
          - authoring de Mechanics e Continuous Aura.

          Com este slice, a suíte comportamental passa de 72 para 73 targets.
          '''
          Path("docs/CONDITION-2-6.md").write_text(textwrap.dedent(doc).lstrip())

          aura_doc = Path("docs/AURA-2.md")
          aura_text = aura_doc.read_text()
          if "## Condition 2.6 — Permanent Board Thresholds" not in aura_text:
              aura_text += r'''

          ## Condition 2.6 — Permanent Board Thresholds

          `allyPermanentsAtLeast` e `enemyPermanentsAtLeast` contam exclusivamente Permanents com `health > 0` nas zonas orientadas pelo controlador. Structures entram por usarem a base `Artifact`; Sentinelas permanecem fora em sua zona dedicada. O envelope de authoring é `1..8`, alinhado ao `permanentsCap` administrável. Entrada e remoção convergem pelos cleanups/recompute já existentes, sem novo hook ou cache. Veja `docs/CONDITION-2-6.md`.
          '''
              aura_doc.write_text(textwrap.dedent(aura_text))
          PY

