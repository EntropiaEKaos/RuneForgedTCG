name: Flagship Mana Rituals Visual Cert

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: flagship-rituals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-cert:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          package-manager-cache: false

      - name: Install dependencies
        run: npm run ci:install

      - name: Typecheck
        run: npm run typecheck

      - name: Build and generate Flagship Mana Rituals
        env:
          NEXT_PUBLIC_APP_URL: https://ci.placeholder.invalid
        run: npm run build

      - name: Certify six Mana Ritual masters in Codex + VER ARTE
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
        run: |
          npm start > /tmp/runeforge-flagship-rituals.log 2>&1 &
          NEXT_PID=$!
          trap 'status=$?; if [ "$status" -ne 0 ]; then echo "--- Next server log ---"; cat /tmp/runeforge-flagship-rituals.log; fi; kill $NEXT_PID 2>/dev/null || true; exit "$status"' EXIT
          for i in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3000/codex >/dev/null; then break; fi
            if [ "$i" = "45" ]; then cat /tmp/runeforge-flagship-rituals.log; exit 1; fi
            sleep 1
          done
          node scripts/alpha-flagship-rituals-browser-cert.mjs

      - name: Upload Mana Ritual visual evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flagship-rituals-${{ github.sha }}
          path: artifacts/alpha-visual/12*-ritual-*-art-viewer.png
          if-no-files-found: error
          retention-days: 14
