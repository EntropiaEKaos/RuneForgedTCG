name: Temporary Compatible Lock Refresh

on:
  push:
    branches:
      - engineering/dependency-hygiene-2.97.4-compatible

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          package-manager-cache: false

      - name: Regenerate lockfile
        run: npm run lock:refresh

      - name: Verify clean install and compatible lint stack
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          test "$(node -p "require('./node_modules/eslint/package.json').version")" = "9.39.5"
          node -e "const p=require('./package-lock.json'); if (p.packages[''].devDependencies.eslint !== '9.39.5') process.exit(1)"

      - name: Commit verified lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          test -z "$(git status --porcelain | grep -v '^ M package-lock.json$' || true)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): refresh compatible dependency lockfile"
          git push origin HEAD:engineering/dependency-hygiene-2.97.4-compatible
