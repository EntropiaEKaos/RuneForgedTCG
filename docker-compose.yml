services:
  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: runeforge_alpha
      POSTGRES_USER: runeforge
      POSTGRES_PASSWORD: runeforge_alpha_only
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runeforge -d runeforge_alpha"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - runeforge_alpha_postgres:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  runeforge_alpha_postgres:

