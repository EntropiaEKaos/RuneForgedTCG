services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: runeforge_verify
      POSTGRES_USER: runeforge
      POSTGRES_PASSWORD: runeforge_verify_only
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runeforge -d runeforge_verify"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
